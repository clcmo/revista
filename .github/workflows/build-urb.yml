name: Build revista urbanna (test)

on:
  push:
    branches: [test/ourbanna-content]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-urbanna-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import content from RSS and APIs
        run: python3 scripts/fetch_content.py

      - name: Generate local preview
        run: python3 scripts/build_preview.py

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp main.pdf public/revista.pdf
          cp site/index.html public/index.html
          cp site/preview.html public/preview.html
          cp site/preview.css public/preview.css
          cp site/ourbanna-theme.css public/ourbanna-theme.css
          cp -R assets public/assets

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ourbanna-preview
          path: public