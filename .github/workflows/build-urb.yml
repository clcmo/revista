name: Build revista urbanna (test)

on:
  push:
    branches: [test/ourbanna-content]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-urbanna-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import content from RSS and APIs
        run: python3 scripts/fetch_content.py

      - name: Generate local preview
        run: python3 scripts/build_preview.py

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/urbanna
          cp main.pdf public/urbanna/revista.pdf
          cp site/index.html public/urbanna/index.html
          cp site/preview.html public/urbanna/preview.html
          cp site/preview.css public/urbanna/preview.css
          cp site/urbanna-theme.css public/urbanna/urbanna-theme.css
          cp -R assets public/assets
          touch public/.nojekyll

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: urbanna-preview
          path: public

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true