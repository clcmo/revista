<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revista</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; }

    a.botao { background: #1b4f72; color: #fff; padding: .5rem 1rem; border-radius: .4rem; text-decoration: none; }

  <header>
    <strong>Edição mais recente</strong>
    <a class="botao" href="revista.pdf" download>Baixar PDF</a>

  <iframe src="revista.pdf" title="Revista em PDF"></iframe>

</html>
